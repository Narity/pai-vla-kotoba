[project]
name = "pai-vla-kotoba"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "imageio[ffmpeg]>=2.38.1",
    "lerobot[metaworld,smolvla]==0.5.1",
    "mujoco==3.8.1",
    "pillow>=13.0.0",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kotoba_vla"

[dependency-groups]
dev = [
    "kaleido>=1.5.0",
    "marimo>=0.25.0",
    "pandas>=2.3.3",
    "plotly>=7.1.0",
    "pytest>=9.2.0",
]
